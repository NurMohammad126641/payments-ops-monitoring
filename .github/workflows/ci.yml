name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,sheets]"
      - run: ruff check .
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsmon
          POSTGRES_PASSWORD: opsmon
          POSTGRES_DB: payments
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsmon -d payments"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PAYMENTS_DB_URL: postgresql://opsmon:opsmon@localhost:5432/payments
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Load demo schema and synthetic data
        run: psql "$PAYMENTS_DB_URL" -v ON_ERROR_STOP=1 -f demo/init/01_schema.sql -f demo/init/02_seed.sql
      - run: pytest -q -m integration
      - name: Full CLI run (the seeded incident makes this exit 0 with an alert, not a failure)
        run: opsmon run --sink csv --out out --no-alerts
      - uses: actions/upload-artifact@v5
        with:
          name: sample-output
          path: out/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
